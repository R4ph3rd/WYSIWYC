<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <rect width="280" height="200" fill="#f8fafc"/>
  <text x="140" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Task 4 — Settings Form</text>
  <!-- Card -->
  <rect x="24" y="38" width="232" height="148" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="58" font-family="sans-serif" font-size="10" font-weight="600" fill="#1e293b">Account Settings</text>
  <!-- Name row -->
  <text x="40" y="76" font-family="sans-serif" font-size="8" fill="#94a3b8">Display name</text>
  <rect x="40" y="82" width="212" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Email row -->
  <text x="40" y="112" font-family="sans-serif" font-size="8" fill="#94a3b8">Email</text>
  <rect x="40" y="118" width="212" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Toggle row -->
  <text x="40" y="148" font-family="sans-serif" font-size="8" fill="#1e293b">Email notifications</text>
  <rect x="208" y="140" width="28" height="16" rx="8" fill="#6366f1"/>
  <circle cx="226" cy="148" r="6" fill="white"/>
  <!-- Save button -->
  <rect x="40" y="162" width="212" height="16" rx="4" fill="#6366f1"/>
  <text x="146" y="173" font-family="sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">Save changes</text>
</svg>
