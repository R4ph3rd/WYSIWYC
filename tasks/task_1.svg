<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <rect width="280" height="200" fill="#f8fafc"/>
  <!-- Login screen wireframe -->
  <text x="140" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Task 1 — Login Screen</text>
  <!-- Card -->
  <rect x="60" y="40" width="160" height="148" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Logo placeholder -->
  <rect x="110" y="54" width="60" height="20" rx="4" fill="#e2e8f0"/>
  <!-- Email field -->
  <rect x="76" y="86" width="128" height="20" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="88" y="100" font-family="sans-serif" font-size="8" fill="#94a3b8">Email address</text>
  <!-- Password field -->
  <rect x="76" y="114" width="128" height="20" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="88" y="128" font-family="sans-serif" font-size="8" fill="#94a3b8">Password</text>
  <!-- Button -->
  <rect x="76" y="142" width="128" height="24" rx="4" fill="#6366f1"/>
  <text x="140" y="157" font-family="sans-serif" font-size="9" font-weight="600" fill="white" text-anchor="middle">Sign in</text>
  <!-- Link -->
  <text x="140" y="178" font-family="sans-serif" font-size="8" fill="#6366f1" text-anchor="middle">Forgot password?</text>
</svg>
