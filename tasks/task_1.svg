<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Task 1 · Sign-in card (accent indigo #4f46e5) -->
  <rect width="640" height="440" fill="#eef2ff"/>
  <rect x="180" y="28" width="280" height="384" rx="16" fill="#ffffff" stroke="#e0e7ff"/>
  <!-- brand -->
  <rect x="204" y="52" width="28" height="28" rx="8" fill="#4f46e5"/>
  <path d="M212 70 l6 -10 l6 10 z" fill="#ffffff"/>
  <text x="240" y="71" font-size="14" font-weight="700" fill="#1e1b4b">Northwind</text>
  <!-- heading -->
  <text x="204" y="112" font-size="20" font-weight="700" fill="#0f172a">Welcome back</text>
  <text x="204" y="132" font-size="11" fill="#64748b">Sign in to continue to your workspace.</text>
  <!-- email -->
  <text x="204" y="160" font-size="10" font-weight="600" fill="#334155">Email</text>
  <rect x="204" y="166" width="232" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="216" y="187" font-size="11" fill="#94a3b8">you@company.com</text>
  <!-- password -->
  <text x="204" y="220" font-size="10" font-weight="600" fill="#334155">Password</text>
  <text x="436" y="220" font-size="10" font-weight="600" fill="#4f46e5" text-anchor="end">Forgot?</text>
  <rect x="204" y="226" width="232" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="216" y="247" font-size="11" fill="#94a3b8">••••••••</text>
  <!-- remember -->
  <rect x="204" y="272" width="14" height="14" rx="3" fill="#4f46e5"/>
  <path d="M207 279 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text x="226" y="283" font-size="11" fill="#334155">Remember me</text>
  <!-- primary -->
  <rect x="204" y="298" width="232" height="36" rx="8" fill="#4f46e5"/>
  <text x="320" y="320" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Sign in</text>
  <!-- divider -->
  <line x1="204" y1="352" x2="300" y2="352" stroke="#e2e8f0"/>
  <text x="320" y="356" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <line x1="340" y1="352" x2="436" y2="352" stroke="#e2e8f0"/>
  <!-- secondary -->
  <rect x="204" y="366" width="232" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="262" cy="383" r="6" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="330" y="387" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Continue with Google</text>
  <!-- footer -->
  <text x="320" y="432" font-size="10" fill="#64748b" text-anchor="middle">No account? <tspan fill="#4f46e5" font-weight="600">Create one</tspan></text>
</svg>
