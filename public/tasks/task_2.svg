<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Task 2 · Dense revenue dashboard card (accent emerald #059669) -->
  <rect width="640" height="440" fill="#f1f5f9"/>
  <rect x="140" y="30" width="360" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header -->
  <text x="164" y="66" font-size="14" font-weight="700" fill="#0f172a">Monthly revenue</text>
  <rect x="368" y="50" width="108" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="380" y="67" font-size="10" fill="#334155">Last 30 days</text>
  <path d="M462 61 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <!-- big number + delta -->
  <text x="164" y="116" font-size="32" font-weight="800" fill="#0f172a">$48,290</text>
  <rect x="314" y="96" width="62" height="22" rx="11" fill="#d1fae5"/>
  <text x="345" y="111" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">▲ 12.4%</text>
  <text x="164" y="136" font-size="10" fill="#64748b">vs. $42,960 the previous period</text>
  <!-- bar chart -->
  <line x1="164" y1="250" x2="476" y2="250" stroke="#e2e8f0"/>
  <rect x="176" y="206" width="26" height="44" rx="4" fill="#a7f3d0"/>
  <rect x="219" y="190" width="26" height="60" rx="4" fill="#a7f3d0"/>
  <rect x="262" y="214" width="26" height="36" rx="4" fill="#a7f3d0"/>
  <rect x="305" y="176" width="26" height="74" rx="4" fill="#a7f3d0"/>
  <rect x="348" y="184" width="26" height="66" rx="4" fill="#a7f3d0"/>
  <rect x="391" y="160" width="26" height="90" rx="4" fill="#a7f3d0"/>
  <rect x="434" y="150" width="26" height="100" rx="4" fill="#059669"/>
  <g font-size="9" fill="#94a3b8" text-anchor="middle">
    <text x="189" y="266">Mon</text><text x="232" y="266">Tue</text><text x="275" y="266">Wed</text>
    <text x="318" y="266">Thu</text><text x="361" y="266">Fri</text><text x="404" y="266">Sat</text><text x="447" y="266">Sun</text>
  </g>
  <!-- KPI rows -->
  <line x1="164" y1="284" x2="476" y2="284" stroke="#f1f5f9"/>
  <text x="164" y="304" font-size="11" fill="#475569">Orders</text>
  <text x="476" y="304" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">1,204</text>
  <line x1="164" y1="316" x2="476" y2="316" stroke="#f1f5f9"/>
  <text x="164" y="336" font-size="11" fill="#475569">Avg. order value</text>
  <text x="476" y="336" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">$40.10</text>
  <line x1="164" y1="348" x2="476" y2="348" stroke="#f1f5f9"/>
  <text x="164" y="368" font-size="11" fill="#475569">Refund rate</text>
  <text x="476" y="368" font-size="11" font-weight="700" fill="#e11d48" text-anchor="end">1.8%</text>
  <!-- footer link -->
  <text x="164" y="396" font-size="11" font-weight="600" fill="#059669">View full report →</text>
</svg>
